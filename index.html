<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyblade X Scorekeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap');
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Lucide Icons (เนื่องจากใช้ CDN)
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        function App() {
            const [player1Score, setPlayer1Score] = useState(0);
            const [player2Score, setPlayer2Score] = useState(0);
            const [player1Name, setPlayer1Name] = useState('Player B');
            const player2Name = 'Player X';
            const [player1Wins, setPlayer1Wins] = useState(0);
            const [player2Wins, setPlayer2Wins] = useState(0);
            const [winner, setWinner] = useState(null);
            const [showNameInput, setShowNameInput] = useState(false);
            const [showRules, setShowRules] = useState(false);

            const playFinishSound = () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 1000;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            };

            const addScore = (player, points) => {
                if (winner) return;
                playFinishSound();
                if (player === 1) {
                    const newScore = player1Score + points;
                    setPlayer1Score(newScore);
                    if (newScore >= 4) { setWinner(player1Name); setPlayer1Wins(prev => prev + 1); }
                } else {
                    const newScore = player2Score + points;
                    setPlayer2Score(newScore);
                    if (newScore >= 4) { setWinner(player2Name); setPlayer2Wins(prev => prev + 1); }
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-red-900 p-4 flex flex-col text-white">
                    <div className="w-full max-w-4xl mx-auto flex-1 flex flex-col">
                        <h1 className="text-3xl md:text-5xl font-bold text-center mb-4 drop-shadow-lg">⚡ BEYBLADE X ⚡</h1>
                        
                        <div className="bg-white/20 backdrop-blur-sm rounded-xl p-3 mb-4 flex justify-center gap-8">
                            <div className="text-center">
                                <div className="text-sm opacity-80">รอบชนะ</div>
                                <div className="text-3xl font-bold">{player1Wins}</div>
                            </div>
                            <div className="text-4xl self-center opacity-50">:</div>
                            <div className="text-center">
                                <div className="text-sm opacity-80">รอบชนะ</div>
                                <div className="text-3xl font-bold">{player2Wins}</div>
                            </div>
                        </div>

                        {winner && (
                            <div className="bg-yellow-400 border-4 border-yellow-600 rounded-2xl p-4 mb-4 text-center text-yellow-900 animate-bounce">
                                <h2 className="text-2xl font-bold">🎉 {winner} ชนะ! 🎉</h2>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-4 mb-4">
                            {/* Player 1 */}
                            <div className="bg-blue-600 rounded-3xl p-4 border-4 border-blue-400">
                                <h2 className="text-xl font-bold text-center">{player1Name}</h2>
                                <div className="text-6xl font-bold text-center my-2">{player1Score}</div>
                                <div className="grid grid-cols-1 gap-2">
                                    <button onClick={() => addScore(1, 1)} className="bg-green-500 p-2 rounded">Spin (1)</button>
                                    <button onClick={() => addScore(1, 2)} className="bg-orange-500 p-2 rounded">Burst/Over (2)</button>
                                    <button onClick={() => addScore(1, 3)} className="bg-red-500 p-2 rounded">Extreme (3)</button>
                                </div>
                            </div>
                            {/* Player 2 */}
                            <div className="bg-red-600 rounded-3xl p-4 border-4 border-red-400">
                                <h2 className="text-xl font-bold text-center">{player2Name}</h2>
                                <div className="text-6xl font-bold text-center my-2">{player2Score}</div>
                                <div className="grid grid-cols-1 gap-2">
                                    <button onClick={() => addScore(2, 1)} className="bg-green-500 p-2 rounded">Spin (1)</button>
                                    <button onClick={() => addScore(2, 2)} className="bg-orange-500 p-2 rounded">Burst/Over (2)</button>
                                    <button onClick={() => addScore(2, 3)} className="bg-red-500 p-2 rounded">Extreme (3)</button>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-center gap-4">
                            <button onClick={() => {setPlayer1Score(0); setPlayer2Score(0); setWinner(null);}} className="bg-white text-black px-6 py-2 rounded-xl font-bold">รอบใหม่</button>
                            <button onClick={() => location.reload()} className="bg-red-500 text-white px-6 py-2 rounded-xl font-bold">รีเซ็ตทั้งหมด</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
