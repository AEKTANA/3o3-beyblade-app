<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* ป้องกันการรูดจอทิ้ง */
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            flex: 1;
        }

        /* ปรับปุ่มสลับหน้าจอให้เล็กลงในแนวนอน */
        .orientation-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .win-counter {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: white;
            height: 50px;
        }

        .win-item { display: flex; align-items: center; gap: 8px; }
        .win-count { font-size: 1.4rem; font-weight: bold; }
        .win-name { font-size: 0.8rem; font-weight: bold; }

        .players-grid {
            display: grid;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        /* โหมดแนวนอน (Horizontal) - แก้ไขให้พอดีจอ */
        .players-grid.horizontal {
            grid-template-columns: 1fr 1fr;
        }

        .player-card {
            border-radius: 15px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            border: 3px solid;
            justify-content: space-between;
        }

        .player1 { background: #2563eb; border-color: #60a5fa; }
        .player2 { background: #dc2626; border-color: #f87171; }

        .player-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 5px;
        }

        .player-name { font-size: 1rem; font-weight: bold; color: white; }
        .player-score { font-size: 2.5rem; font-weight: bold; color: white; line-height: 1; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .score-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .score-btn {
            padding: 6px 2px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .score-btn-icon { font-size: 1rem; }

        /* สีปุ่มเดิม */
        .btn-spin { background: #22c55e; }
        .btn-burst { background: #f97316; }
        .btn-over { background: #a855f7; }
        .btn-extreme { background: #dc2626; }

        .subtract-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .subtract-btn {
            padding: 4px;
            background: rgba(0,0,0,0.3);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 0.7rem;
        }

        .bottom-controls {
            padding: 5px 0;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .control-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-reset { background: white; color: #1f2937; }
        .btn-reset-all { background: #dc2626; color: white; }
        .btn-rules { background: #fbbf24; color: #1f2937; }

        .credit {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.6rem;
        }

        /* โหมดแนวตั้ง (Vertical) */
        .players-grid.vertical {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="orientation-btn" onclick="toggleOrientation()">
                <span id="orientationIcon">↕️</span> <span id="orientationText">Vertical</span>
            </button>
            <h1 class="title">⚡ BEYBLADE X ⚡</h1>
            <div style="width: 70px;"></div>
        </div>
        
        <div class="win-counter">
            <div class="win-item">
                <div class="win-count" id="player1Wins">0</div>
                <div class="win-name" id="displayPlayer1Name">Player B</div>
            </div>
            <div style="color: white; opacity: 0.5;">VS</div>
            <div class="win-item">
                <div class="win-count" id="player2Wins">0</div>
                <div class="win-name">Player X</div>
            </div>
        </div>

        <div id="playersGrid" class="players-grid horizontal">
            <div class="player-card player1">
                <div class="player-header">
                    <span class="player-name">Player B</span>
                    <span class="player-score" id="player1Score">0</span>
                </div>
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(1, 1)"><span class="score-btn-icon">🌀</span> Spin</button>
                        <button class="score-btn btn-burst" onclick="addScore(1, 2)"><span class="score-btn-icon">💥</span> Burst</button>
                        <button class="score-btn btn-over" onclick="addScore(1, 2)"><span class="score-btn-icon">🕳️</span> Over</button>
                        <button class="score-btn btn-extreme" onclick="addScore(1, 3)"><span class="score-btn-icon">⚡</span> Extreme</button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(1, 1)">-1</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 2)">-2</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 3)">-3</button>
                    </div>
                </div>
            </div>

            <div class="player-card player2">
                <div class="player-header">
                    <span class="player-name">Player X</span>
                    <span class="player-score" id="player2Score">0</span>
                </div>
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(2, 1)"><span class="score-btn-icon">🌀</span> Spin</button>
                        <button class="score-btn btn-burst" onclick="addScore(2, 2)"><span class="score-btn-icon">💥</span> Burst</button>
                        <button class="score-btn btn-over" onclick="addScore(2, 2)"><span class="score-btn-icon">🕳️</span> Over</button>
                        <button class="score-btn btn-extreme" onclick="addScore(2, 3)"><span class="score-btn-icon">⚡</span> Extreme</button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(2, 1)">-1</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 2)">-2</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 3)">-3</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="button-row">
                <button class="control-btn btn-reset" onclick="resetRound()">New Round</button>
                <button class="control-btn btn-reset-all" onclick="resetAll()">Reset All</button>
                <button class="control-btn btn-rules" onclick="toggleRules()">Rules</button>
            </div>
            <div class="credit">By oongET</div>
        </div>
    </div>

    </body>
</html>
