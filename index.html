<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @media (min-width: 640px) {
            .title {
                font-size: 2.5rem;
            }
        }

        .win-counter {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            color: white;
        }

        .win-item {
            text-align: center;
        }

        .win-label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .win-count {
            font-size: 2rem;
            font-weight: bold;
        }

        .win-name {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .win-separator {
            font-size: 2rem;
            opacity: 0.5;
        }

        .winner-banner {
            background: #fbbf24;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .winner-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            color: #92400e;
        }

        .winner-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #92400e;
        }

        @media (min-width: 640px) {
            .winner-text {
                font-size: 2rem;
            }
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .player-card {
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            border: 4px solid;
        }

        .player1 {
            background: #2563eb;
            border-color: #60a5fa;
        }

        .player2 {
            background: #dc2626;
            border-color: #f87171;
        }

        .player-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: color 0.2s;
        }

        .player1 .player-name:hover {
            color: #bfdbfe;
        }

        .player-name input {
            font-size: 1.25rem;
            font-weight: bold;
            background: white;
            color: #1e3a8a;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            border: none;
        }

        .player-score {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .player-score-label {
            font-size: 1rem;
            opacity: 0.8;
            color: white;
        }

        .player1 .player-score-label {
            color: #bfdbfe;
        }

        .player2 .player-score-label {
            color: #fecaca;
        }

        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .score-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .score-btn {
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .score-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .score-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .score-btn-label {
            display: block;
        }

        .score-btn-points {
            display: block;
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .btn-spin {
            background: #22c55e;
        }

        .btn-spin:hover:not(:disabled) {
            background: #16a34a;
        }

        .btn-burst {
            background: #f97316;
        }

        .btn-burst:hover:not(:disabled) {
            background: #ea580c;
        }

        .btn-over {
            background: #a855f7;
        }

        .btn-over:hover:not(:disabled) {
            background: #9333ea;
        }

        .btn-extreme {
            background: #dc2626;
        }

        .btn-extreme:hover:not(:disabled) {
            background: #b91c1c;
        }

        .subtract-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .subtract-btn {
            padding: 8px 6px;
            background: #374151;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .subtract-btn:hover:not(:disabled) {
            background: #4b5563;
            transform: scale(1.05);
        }

        .subtract-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bottom-controls {
            text-align: center;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .btn-reset {
            background: white;
            color: #1f2937;
        }

        .btn-reset-all {
            background: #dc2626;
            color: white;
        }

        .btn-rules {
            background: #fbbf24;
            color: #1f2937;
        }

        .rules-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            color: white;
            margin-top: 10px;
        }

        .rules-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }

        @media (min-width: 640px) {
            .rules-grid {
                grid-template-columns: repeat(4, 1fr);
                font-size: 1rem;
            }
        }

        .rule-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rule-badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
        }

        .rule-win {
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fde047;
        }

        .credit {
            text-align: center;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">⚡ BEYBLADE X ⚡</h1>
        
        <!-- Win Counter -->
        <div class="win-counter">
            <div class="win-item">
                <div class="win-label">รอบชนะ</div>
                <div class="win-count" id="player1Wins">0</div>
                <div class="win-name" id="displayPlayer1Name">Player B</div>
            </div>
            <div class="win-separator">:</div>
            <div class="win-item">
                <div class="win-label">รอบชนะ</div>
                <div class="win-count" id="player2Wins">0</div>
                <div class="win-name">Player X</div>
            </div>
        </div>

        <!-- Winner Banner -->
        <div id="winnerBanner" class="winner-banner" style="display: none;">
            <div class="winner-icon">🏆</div>
            <div class="winner-text" id="winnerText"></div>
        </div>

        <!-- Players Grid -->
        <div class="players-grid">
            <!-- Player 1 (Player B) -->
            <div class="player-card player1">
                <div class="player-header">
                    <div class="player-name" id="player1NameDisplay" onclick="editPlayer1Name()">
                        <span id="player1NameText">Player B</span>
                        <input type="text" id="player1NameInput" style="display: none;">
                    </div>
                    <div class="player-score" id="player1Score">0</div>
                    <div class="player-score-label">คะแนน</div>
                </div>
                
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(1, 1, 'Spin Finish')">
                            <span class="score-btn-label">Spin Finish</span>
                            <span class="score-btn-points">1 แต้ม</span>
                        </button>
                        <button class="score-btn btn-burst" onclick="addScore(1, 2, 'Burst Finish')">
                            <span class="score-btn-label">Burst Finish</span>
                            <span class="score-btn-points">2 แต้ม</span>
                        </button>
                        <button class="score-btn btn-over" onclick="addScore(1, 2, 'Over Finish')">
                            <span class="score-btn-label">Over Finish</span>
                            <span class="score-btn-points">2 แต้ม</span>
                        </button>
                        <button class="score-btn btn-extreme" onclick="addScore(1, 3, 'Extreme Finish')">
                            <span class="score-btn-label">Extreme Finish</span>
                            <span class="score-btn-points">3 แต้ม</span>
                        </button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(1, 1)">ลบ 1</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 2)">ลบ 2</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 3)">ลบ 3</button>
                    </div>
                </div>
            </div>

            <!-- Player 2 (Player X) -->
            <div class="player-card player2">
                <div class="player-header">
                    <div class="player-name">
                        <span>Player X</span>
                    </div>
                    <div class="player-score" id="player2Score">0</div>
                    <div class="player-score-label">คะแนน</div>
                </div>
                
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(2, 1, 'Spin Finish')">
                            <span class="score-btn-label">Spin Finish</span>
                            <span class="score-btn-points">1 แต้ม</span>
                        </button>
                        <button class="score-btn btn-burst" onclick="addScore(2, 2, 'Burst Finish')">
                            <span class="score-btn-label">Burst Finish</span>
                            <span class="score-btn-points">2 แต้ม</span>
                        </button>
                        <button class="score-btn btn-over" onclick="addScore(2, 2, 'Over Finish')">
                            <span class="score-btn-label">Over Finish</span>
                            <span class="score-btn-points">2 แต้ม</span>
                        </button>
                        <button class="score-btn btn-extreme" onclick="addScore(2, 3, 'Extreme Finish')">
                            <span class="score-btn-label">Extreme Finish</span>
                            <span class="score-btn-points">3 แต้ม</span>
                        </button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(2, 1)">ลบ 1</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 2)">ลบ 2</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 3)">ลบ 3</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <div class="button-row">
                <button class="control-btn btn-reset" onclick="reset()">
                    <span class="icon">🔄</span>
                    รอบใหม่
                </button>
                <button class="control-btn btn-reset-all" onclick="resetAll()">
                    <span class="icon">🔄</span>
                    รีเซ็ตทั้งหมด
                </button>
                <button class="control-btn btn-rules" onclick="toggleRules()">
                    <span class="icon" id="rulesIcon">▼</span>
                    กติกา
                </button>
            </div>

            <!-- Rules Panel -->
            <div id="rulesPanel" class="rules-panel" style="display: none;">
                <h3 class="rules-title">📋 กติกาการนับแต้ม</h3>
                <div class="rules-grid">
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #22c55e;">1</span>
                        <span>Spin Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #f97316;">2</span>
                        <span>Burst Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #a855f7;">2</span>
                        <span>Over Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #dc2626;">3</span>
                        <span>Extreme Finish</span>
                    </div>
                </div>
                <p class="rule-win">🏆 ผู้เล่นที่ได้ 4 คะแนนก่อน เป็นผู้ชนะ! 🏆</p>
            </div>

            <div class="credit">By oongET</div>
        </div>
    </div>

    <script>
        let state = {
            player1Score: 0,
            player2Score: 0,
            player1Name: 'Player B',
            player2Name: 'Player X',
            player1Wins: 0,
            player2Wins: 0,
            winner: null,
            audioContext: null
        };

        // Initialize audio context on first user interaction
        function initAudio() {
            if (!state.audioContext) {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playFinishSound() {
            try {
                initAudio();
                const oscillator = state.audioContext.createOscillator();
                const gainNode = state.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(state.audioContext.destination);
                
                oscillator.frequency.value = 1000;
                oscillator.type = 'sine';
                
                const now = state.audioContext.currentTime;
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } catch (error) {
                console.log('Audio not supported:', error);
            }
        }

        function playWinSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                
                notes.forEach((freq, index) => {
                    const oscillator = state.audioContext.createOscillator();
                    const gainNode = state.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(state.audioContext.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    const startTime = state.audioContext.currentTime + (index * 0.15);
                    gainNode.gain.setValueAtTime(0.3, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.3);
                });
            } catch (error) {
                console.log('Audio not supported:', error);
            }
        }

        function addScore(player, points, finishType) {
            if (state.winner) return;
            
            playFinishSound();
            
            if (player === 1) {
                state.player1Score += points;
                document.getElementById('player1Score').textContent = state.player1Score;
                
                if (state.player1Score >= 4) {
                    state.winner = state.player1Name;
                    state.player1Wins++;
