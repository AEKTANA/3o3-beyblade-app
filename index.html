<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            color: white;
            user-select: none;
        }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .orientation-btn { background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 8px 12px; color: white; cursor: pointer; font-weight: bold; }
        .win-counter { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .win-item { text-align: center; }
        .win-count { font-size: 1.8rem; font-weight: bold; }
        .winner-banner { background: #fbbf24; border: 4px solid #f59e0b; border-radius: 16px; padding: 15px; text-align: center; color: #92400e; margin: 10px 0; }
        .players-grid { display: grid; gap: 15px; flex: 1; }
        .players-grid.horizontal { grid-template-columns: 1fr 1fr; }
        .players-grid.vertical { grid-template-columns: 1fr; }
        .player-card { border-radius: 24px; padding: 15px; display: flex; flex-direction: column; border: 4px solid; position: relative; }
        .player1 { background: #2563eb; border-color: #60a5fa; }
        .player2 { background: #dc2626; border-color: #f87171; }
        .player-name { font-size: 1.25rem; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .player-score { font-size: 4rem; font-weight: bold; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .score-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .score-btn { padding: 12px 5px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; display: flex; flex-direction: column; align-items: center; transition: transform 0.1s; }
        .score-btn:active { transform: scale(0.95); }
        .btn-spin { background: #22c55e; } .btn-burst { background: #f97316; } .btn-over { background: #a855f7; } .btn-extreme { background: #dc2626; }
        .subtract-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
        .sub-btn { background: rgba(0,0,0,0.3); border: none; border-radius: 5px; color: white; padding: 5px; font-size: 0.8rem; }
        .bottom-controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .ctrl-btn { padding: 12px 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .rules-panel { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="orientation-btn" onclick="toggleLayout()">↕️ <span id="layoutText">Vertical</span></button>
            <div class="title">⚡ BEYBLADE X ⚡</div>
            <div style="width:60px"></div>
        </div>

        <div class="win-counter">
            <div class="win-item"><div class="win-count" id="w1">0</div><div id="n1">Player B</div></div>
            <div style="font-size:1.5rem">⚔️</div>
            <div class="win-item"><div class="win-count" id="w2">0</div><div>Player X</div></div>
        </div>

        <div id="winBanner" class="winner-banner" style="display:none">
            <h2 id="winMsg">PLAYER WINS!</h2>
        </div>

        <div id="grid" class="players-grid horizontal">
            <div class="player-card player1">
                <div class="player-name" onclick="changeName()">
                    <span id="nameLabel">Player B</span>
                    <input id="nameInput" style="display:none; width:80%">
                </div>
                <div class="player-score" id="s1">0</div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="add(1,1)">🌀<span>Spin</span><span>1PT</span></button>
                    <button class="score-btn btn-burst" onclick="add(1,2)">💥<span>Burst</span><span>2PT</span></button>
                    <button class="score-btn btn-over" onclick="add(1,2)">🕳️<span>Over</span><span>2PT</span></button>
                    <button class="score-btn btn-extreme" onclick="add(1,3)">⚡<span>Xtreme</span><span>3PT</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="sub-btn" onclick="sub(1,1)">-1</button>
                    <button class="sub-btn" onclick="sub(1,2)">-2</button>
                    <button class="sub-btn" onclick="sub(1,3)">-3</button>
                </div>
            </div>

            <div class="player-card player2">
                <div class="player-name">Player X</div>
                <div class="player-score" id="s2">0</div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="add(2,1)">🌀<span>Spin</span><span>1PT</span></button>
                    <button class="score-btn btn-burst" onclick="add(2,2)">💥<span>Burst</span><span>2PT</span></button>
                    <button class="score-btn btn-over" onclick="add(2,2)">🕳️<span>Over</span><span>2PT</span></button>
                    <button class="score-btn btn-extreme" onclick="add(2,3)">⚡<span>Xtreme</span><span>3PT</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="sub-btn" onclick="sub(2,1)">-1</button>
                    <button class="sub-btn" onclick="sub(2,2)">-2</button>
                    <button class="sub-btn" onclick="sub(2,3)">-3</button>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <button class="ctrl-btn" style="background:white" onclick="resetR()">🔄 New Round</button>
            <button class="ctrl-btn" style="background:#dc2626; color:white" onclick="resetA()">🔁 Reset All</button>
            <button class="ctrl-btn" style="background:#fbbf24" onclick="toggleR()">📋 Rules</button>
        </div>

        <div id="rules" class="rules-panel" style="display:none">
            <p>🌀 Spin: 1PT | 💥 Burst/Over: 2PT | ⚡ Xtreme: 3PT</p>
            <p style="text-align:center; color:yellow; margin-top:5px">First to 4 points wins!</p>
        </div>
    </div>

    <script>
        let sc1 = 0, sc2 = 0, win1 = 0, win2 = 0, pName = "Player B", over = false;
        let aCtx = null;

        function initA() { 
            if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (aCtx.state === 'suspended') aCtx.resume();
        }

        function beep(f, d) {
            try {
                initA();
                let o = aCtx.createOscillator(), g = aCtx.createGain();
                o.connect(g); g.connect(aCtx.destination);
                o.frequency.value = f; g.gain.setValueAtTime(0.1, aCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, aCtx.currentTime + d);
                o.start(); o.stop(aCtx.currentTime + d);
            } catch(e) {}
        }

        function add(p, v) {
            if (over) return;
            beep(800, 0.1);
            if (p === 1) {
                sc1 += v; document.getElementById('s1').innerText = sc1;
                if (sc1 >= 4) finish(pName, 1);
            } else {
                sc2 += v; document.getElementById('s2').innerText = sc2;
                if (sc2 >= 4) finish("Player X", 2);
            }
        }
