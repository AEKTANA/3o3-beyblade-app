<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            flex: 1;
        }

        @media (min-width: 640px) {
            .title {
                font-size: 2.5rem;
            }
        }

        .orientation-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .orientation-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .orientation-icon {
            font-size: 1.2rem;
        }

        .win-counter {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .win-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .win-icon {
            font-size: 1.5rem;
        }

        .win-label {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .win-count {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .win-name {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: bold;
        }

        .win-separator {
            font-size: 2rem;
            opacity: 0.7;
        }

        .winner-banner {
            background: #fbbf24;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .winner-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .winner-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #92400e;
        }

        @media (min-width: 640px) {
            .winner-text {
                font-size: 2rem;
            }
        }

        .players-grid {
            display: grid;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .players-grid.horizontal {
            grid-template-columns: 1fr 1fr;
        }

        .players-grid.vertical {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .player-card {
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            border: 4px solid;
        }

        .player1 {
            background: #2563eb;
            border-color: #60a5fa;
        }

        .player2 {
            background: #dc2626;
            border-color: #f87171;
        }

        .player-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: color 0.2s;
        }

        .player1 .player-name:hover {
            color: #bfdbfe;
        }

        .player-name input {
            font-size: 1.25rem;
            font-weight: bold;
            background: white;
            color: #1e3a8a;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            border: none;
        }

        .player-score {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .player-score-label {
            font-size: 1rem;
            opacity: 0.8;
            color: white;
        }

        .player1 .player-score-label {
            color: #bfdbfe;
        }

        .player2 .player-score-label {
            color: #fecaca;
        }

        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .score-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .score-btn {
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .score-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .score-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .score-btn-icon {
            font-size: 1.5rem;
        }

        .score-btn-label {
            display: block;
            font-size: 0.75rem;
        }

        .score-btn-points {
            display: block;
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-spin {
            background: #22c55e;
        }

        .btn-spin:hover:not(:disabled) {
            background: #16a34a;
        }

        .btn-burst {
            background: #f97316;
        }

        .btn-burst:hover:not(:disabled) {
            background: #ea580c;
        }

        .btn-over {
            background: #a855f7;
        }

        .btn-over:hover:not(:disabled) {
            background: #9333ea;
        }

        .btn-extreme {
            background: #dc2626;
        }

        .btn-extreme:hover:not(:disabled) {
            background: #b91c1c;
        }

        .subtract-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .subtract-btn {
            padding: 8px 6px;
            background: #374151;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .subtract-btn:hover:not(:disabled) {
            background: #4b5563;
            transform: scale(1.05);
        }

        .subtract-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bottom-controls {
            text-align: center;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .btn-reset {
            background: white;
            color: #1f2937;
        }

        .btn-reset-all {
            background: #dc2626;
            color: white;
        }

        .btn-rules {
            background: #fbbf24;
            color: #1f2937;
        }

        .rules-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            color: white;
            margin-top: 10px;
        }

        .rules-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }

        @media (min-width: 640px) {
            .rules-grid {
                grid-template-columns: repeat(4, 1fr);
                font-size: 1rem;
            }
        }

        .rule-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rule-badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
        }

        .rule-win {
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fde047;
        }

        .credit {
            text-align: center;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        .icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="orientation-btn" onclick="toggleOrientation()">
                <span class="orientation-icon" id="orientationIcon">↕️</span>
                <span id="orientationText">Vertical</span>
            </button>
            <h1 class="title">⚡ BEYBLADE X ⚡</h1>
            <div style="width: 100px;"></div>
        </div>
        
        <div class="win-counter">
            <div class="win-item">
                <div class="win-icon">🏆</div>
                <div class="win-label">Wins</div>
                <div class="win-count" id="player1Wins">0</div>
                <div class="win-name" id="displayPlayer1Name">Player B</div>
            </div>
            <div class="win-separator">⚔️</div>
            <div class="win-item">
                <div class="win-icon">🏆</div>
                <div class="win-label">Wins</div>
                <div class="win-count" id="player2Wins">0</div>
                <div class="win-name">Player X</div>
            </div>
        </div>

        <div id="winnerBanner" class="winner-banner" style="display: none;">
            <div class="winner-icon">🏆</div>
            <div class="winner-text" id="winnerText"></div>
        </div>

        <div id="playersGrid" class="players-grid horizontal">
            <div class="player-card player1">
                <div class="player-header">
                    <div class="player-name" id="player1NameDisplay" onclick="editPlayer1Name()">
                        <span id="player1NameText">Player B</span>
                        <input type="text" id="player1NameInput" style="display: none;">
                    </div>
                    <div class="player-score" id="player1Score">0</div>
                    <div class="player-score-label">Points</div>
                </div>
                
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(1, 1)">
                            <span class="score-btn-icon">🌀</span>
                            <span class="score-btn-label">Spin Finish</span>
                            <span class="score-btn-points">1 PT</span>
                        </button>
                        <button class="score-btn btn-burst" onclick="addScore(1, 2)">
                            <span class="score-btn-icon">💥</span>
                            <span class="score-btn-label">Burst Finish</span>
                            <span class="score-btn-points">2 PT</span>
                        </button>
                        <button class="score-btn btn-over" onclick="addScore(1, 2)">
                            <span class="score-btn-icon">🕳️</span>
                            <span class="score-btn-label">Over Finish</span>
                            <span class="score-btn-points">2 PT</span>
                        </button>
                        <button class="score-btn btn-extreme" onclick="addScore(1, 3)">
                            <span class="score-btn-icon">⚡</span>
                            <span class="score-btn-label">Extreme Finish</span>
                            <span class="score-btn-points">3 PT</span>
                        </button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(1, 1)">➖ 1</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 2)">➖ 2</button>
                        <button class="subtract-btn" onclick="subtractScore(1, 3)">➖ 3</button>
                    </div>
                </div>
            </div>

            <div class="player-card player2">
                <div class="player-header">
                    <div class="player-name">
                        <span>Player X</span>
                    </div>
                    <div class="player-score" id="player2Score">0</div>
                    <div class="player-score-label">Points</div>
                </div>
                
                <div class="controls">
                    <div class="score-buttons">
                        <button class="score-btn btn-spin" onclick="addScore(2, 1)">
                            <span class="score-btn-icon">🌀</span>
                            <span class="score-btn-label">Spin Finish</span>
                            <span class="score-btn-points">1 PT</span>
                        </button>
                        <button class="score-btn btn-burst" onclick="addScore(2, 2)">
                            <span class="score-btn-icon">💥</span>
                            <span class="score-btn-label">Burst Finish</span>
                            <span class="score-btn-points">2 PT</span>
                        </button>
                        <button class="score-btn btn-over" onclick="addScore(2, 2)">
                            <span class="score-btn-icon">🕳️</span>
                            <span class="score-btn-label">Over Finish</span>
                            <span class="score-btn-points">2 PT</span>
                        </button>
                        <button class="score-btn btn-extreme" onclick="addScore(2, 3)">
                            <span class="score-btn-icon">⚡</span>
                            <span class="score-btn-label">Extreme Finish</span>
                            <span class="score-btn-points">3 PT</span>
                        </button>
                    </div>
                    <div class="subtract-buttons">
                        <button class="subtract-btn" onclick="subtractScore(2, 1)">➖ 1</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 2)">➖ 2</button>
                        <button class="subtract-btn" onclick="subtractScore(2, 3)">➖ 3</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="button-row">
                <button class="control-btn btn-reset" onclick="resetRound()">
                    <span class="icon">🔄</span>
                    New Round
                </button>
                <button class="control-btn btn-reset-all" onclick="resetAll()">
                    <span class="icon">🔁</span>
                    Reset All
                </button>
                <button class="control-btn btn-rules" onclick="toggleRules()">
                    <span class="icon" id="rulesIcon">📋</span>
                    Rules
                </button>
            </div>

            <div id="rulesPanel" class="rules-panel" style="display: none;">
                <h3 class="rules-title">📋 Scoring Rules</h3>
                <div class="rules-grid">
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #22c55e;">🌀 1</span>
                        <span>Spin Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #f97316;">💥 2</span>
                        <span>Burst Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #a855f7;">🕳️ 2</span>
                        <span>Over Finish</span>
                    </div>
                    <div class="rule-item">
                        <span class="rule-badge" style="background: #dc2626;">⚡ 3</span>
                        <span>Extreme Finish</span>
                    </div>
                </div>
                <p class="rule-win">🏆 First to 4 points wins! 🏆</p>
            </div>

            <div class="credit">By oongET</div>
        </div>
    </div>

    <script>
        var state = {
            player1Score: 0,
            player2Score: 0,
            player1Name: 'Player B',
            player2Name: 'Player X',
            player1Wins: 0,
            player2Wins: 0,
            winner: null,
            orientation: 'horizontal',
            audioContext: null
        };

        function initAudio() {
            if (!state.audioContext) {
                try {
                    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }
        }

        function playClickSound() {
            try {
                initAudio();
                if (!state.audioContext) return;
                
                var osc = state.audioContext.createOscillator();
                var gain = state.audioContext.createGain();
                
                osc.connect(gain);
                gain.connect(state.audioContext.destination);
                
                osc.frequency.value = 1000;
                osc.type = 'sine';
                
                var now = state.audioContext.currentTime;
                gain.ga
