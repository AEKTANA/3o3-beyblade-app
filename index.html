<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3o3 Beyblade Scorekeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { font-family: 'Orbitron', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .score-btn { transition: all 0.2s; }
        .score-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">
    <h1 class="text-3xl font-bold mb-8 text-blue-400 tracking-widest uppercase">3o3 Battle</h1>
    
    <div class="flex gap-8 mb-12 w-full max-w-sm">
        <div class="flex-1 text-center">
            <h2 class="text-xl mb-2 text-red-500 font-bold">P1</h2>
            <div id="p1-score" class="text-8xl font-black mb-4">0</div>
            <button onclick="changeScore('p1', 1)" class="score-btn w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl text-2xl font-bold shadow-lg shadow-red-900/50">+1</button>
        </div>
        
        <div class="flex flex-col justify-center text-4xl font-bold text-slate-600">VS</div>
        
        <div class="flex-1 text-center">
            <h2 class="text-xl mb-2 text-blue-500 font-bold">P2</h2>
            <div id="p2-score" class="text-8xl font-black mb-4">0</div>
            <button onclick="changeScore('p2', 1)" class="score-btn w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl text-2xl font-bold shadow-lg shadow-blue-900/50">+1</button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 w-full max-w-sm mb-8">
        <button onclick="changeScore('p1', -1)" class="score-btn bg-slate-800 py-3 rounded-lg text-sm text-slate-400">P1 Minus</button>
        <button onclick="changeScore('p2', -1)" class="score-btn bg-slate-800 py-3 rounded-lg text-sm text-slate-400">P2 Minus</button>
    </div>

    <button onclick="reset()" class="w-full max-w-sm bg-slate-700 hover:bg-slate-600 py-4 rounded-xl text-xl font-bold border-b-4 border-slate-900">RESET MATCH</button>

    <div class="mt-12 p-4 bg-slate-900/50 rounded-xl w-full max-w-sm border border-slate-800">
        <h3 class="text-blue-400 font-bold mb-3 uppercase text-sm tracking-widest text-center">Standard Rules (4 Points)</h3>
        <ul class="text-xs space-y-2 text-slate-400 font-sans">
            <li class="flex justify-between border-b border-slate-800 pb-1"><span>Spin Finish</span> <span class="text-white font-bold">1 Point</span></li>
            <li class="flex justify-between border-b border-slate-800 pb-1"><span>Burst Finish</span> <span class="text-white font-bold">2 Points</span></li>
            <li class="flex justify-between border-b border-slate-800 pb-1"><span>Over Finish</span> <span class="text-white font-bold">2 Points</span></li>
            <li class="flex justify-between pb-1"><span>Xtreme Finish</span> <span class="text-white font-bold">3 Points</span></li>
        </ul>
    </div>

    <script>
        let p1 = 0; let p2 = 0;
        function changeScore(player, val) {
            if(player === 'p1') p1 = Math.max(0, p1 + val);
            else p2 = Math.max(0, p2 + val);
            update();
        }
        function reset() { if(confirm('Reset match?')) { p1 = 0; p2 = 0; update(); } }
        function update() {
            document.getElementById('p1-score').innerText = p1;
            document.getElementById('p2-score').innerText = p2;
            if(p1 >= 4) alert('PLAYER 1 WINS!');
            else if(p2 >= 4) alert('PLAYER 2 WINS!');
        }
    </script>
</body>
</html>
