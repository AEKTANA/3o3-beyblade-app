<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyblade X Scoreboard</title>

<style>
:root{
  --bg:#0f1115;
  --card:#181b22;
  --red:#ff4d4d;
  --blue:#4da3ff;
  --text:#fff;
}

*{
  box-sizing:border-box;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:900px;
  padding:16px;
}

h1{
  text-align:center;
  margin-bottom:12px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.top-bar button,
.top-bar input{
  background:var(--card);
  color:var(--text);
  border:1px solid #2a2f3a;
  padding:8px 12px;
  border-radius:10px;
}

.arena{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.player{
  background:var(--card);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.player.red{border:2px solid var(--red);}
.player.blue{border:2px solid var(--blue);}

.score{
  font-size:3rem;
  text-align:center;
  font-weight:bold;
}

.buttons,.finish{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

button{
  cursor:pointer;
}

.buttons button,
.finish button{
  padding:14px 0;
  border-radius:12px;
  border:none;
  background:#222633;
  color:var(--text);
}

.buttons button:active,
.finish button:active{
  transform:scale(0.95);
}

/* ===== WIN OVERLAY ===== */
.win-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.win-box{
  text-align:center;
  animation:pop 0.6s ease-out;
}

.win-text{
  font-size:3rem;
  font-weight:900;
  text-shadow:0 0 20px #fff;
}

@keyframes pop{
  0%{transform:scale(0.4); opacity:0;}
  70%{transform:scale(1.1);}
  100%{transform:scale(1); opacity:1;}
}

@media(max-width:700px){
  .arena{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="app">
  <h1>⚡ BEYBLADE X ⚡</h1>

  <div class="top-bar">
    <button onclick="resetMatch()">🔄 Reset</button>
    Win:
    <input type="number" id="winInput" value="7" min="1" onchange="updateWinPoint()">
    <button onclick="toggleSound()">🔊 <span id="soundText">ON</span></button>
  </div>

  <div class="arena">
    <div class="player red">
      <h2>Player B</h2>
      <div class="score" id="scoreB">0</div>
      <div class="buttons">
        <button onclick="addScore('B',1)">+1</button>
        <button onclick="addScore('B',2)">+2</button>
        <button onclick="addScore('B',3)">+3</button>
      </div>
      <div class="finish">
        <button onclick="addScore('B',3)">Burst</button>
        <button onclick="addScore('B',2)">Over</button>
        <button onclick="addScore('B',3)">Xtreme</button>
      </div>
    </div>

    <div class="player blue">
      <h2>Player X</h2>
      <div class="score" id="scoreX">0</div>
      <div class="buttons">
        <button onclick="addScore('X',1)">+1</button>
        <button onclick="addScore('X',2)">+2</button>
        <button onclick="addScore('X',3)">+3</button>
      </div>
      <div class="finish">
        <button onclick="addScore('X',3)">Burst</button>
        <button onclick="addScore('X',2)">Over</button>
        <button onclick="addScore('X',3)">Xtreme</button>
      </div>
    </div>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay" onclick="closeWin()">
  <div class="win-box">
    <div class="win-text" id="winText"></div>
    <div>แตะหน้าจอเพื่อปิด</div>
  </div>
</div>

<script>
let scoreB=0, scoreX=0, winPoint=7;
let soundOn=true, gameOver=false;

/* ===== SOUND ENGINE ===== */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function beep(freq,dur){
  if(!soundOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioCtx.currentTime + dur
  );
  osc.stop(audioCtx.currentTime + dur);
}

function clickSound(){ beep(600,0.08); }
function winSound(){ beep(1200,0.6); }

function updateWinPoint(){
  const v=parseInt(winInput.value);
  if(v>=1) winPoint=v;
}

function addScore(p,pt){
  if(gameOver) return;
  clickSound();
  if(p==="B"){
    scoreB+=pt;
    scoreBEl.textContent=scoreB;
    if(scoreB>=winPoint) win("Player B");
  }else{
    scoreX+=pt;
    scoreXEl.textContent=scoreX;
    if(scoreX>=winPoint) win("Player X");
  }
}

function win(player){
  gameOver=true;
  winSound();
  winText.textContent = `🏆 ${player} WIN 🏆`;
  winOverlay.style.display="flex";
}

function closeWin(){
  winOverlay.style.display="none";
}

function resetMatch(){
  scoreB=0; scoreX=0; gameOver=false;
  scoreBEl.textContent=0;
  scoreXEl.textContent=0;
  closeWin();
}

function toggleSound(){
  soundOn=!soundOn;
  soundText.textContent=soundOn?"ON":"OFF";
}

/* cache */
const scoreBEl=document.getElementById("scoreB");
const scoreXEl=document.getElementById("scoreX");
const winOverlay=document.getElementById("winOverlay");
const winText=document.getElementById("winText");
const winInput=document.getElementById("winInput");
const soundText=document.getElementById("soundText");
</script>
</body>
</html>
