<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beyblade X Scorekeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;700&display=swap');
        body { font-family: 'Kanit', sans-serif; touch-action: manipulation; overflow: hidden; }
        .celebrate { animation: scale-up 0.5s ease-out; }
        @keyframes scale-up { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-900 text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [p1, setP1] = useState({ name: 'Player B', score: 0, wins: 0 });
            const [p2, setP2] = useState({ name: 'Player X', score: 0, wins: 0 });
            const [winner, setWinner] = useState(null);

            const playSound = (freqs) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.connect(g); g.connect(ctx.destination);
                        osc.frequency.value = f;
                        g.gain.setValueAtTime(0.1, ctx.currentTime + (i * 0.1));
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (i * 0.1) + 0.3);
                        osc.start(ctx.currentTime + (i * 0.1));
                        osc.stop(ctx.currentTime + (i * 0.1) + 0.3);
                    });
                } catch(e) {}
            };

            const addScore = (player, pts) => {
                if (winner) return;
                playSound([880]);
                if (player === 1) {
                    const next = p1.score + pts;
                    setP1({ ...p1, score: next });
                    if (next >= 4) { 
                        setWinner(p1.name); 
                        setP1(v => ({ ...v, wins: v.wins + 1 }));
                        playSound([523, 659, 783, 1046]); // เสียงชนะ
                    }
                } else {
                    const next = p2.score + pts;
                    setP2({ ...p2, score: next });
                    if (next >= 4) { 
                        setWinner(p2.name); 
                        setP2(v => ({ ...v, wins: v.wins + 1 }));
                        playSound([523, 659, 783, 1046]); // เสียงชนะ
                    }
                }
            };

            return (
                <div className="h-screen flex flex-col p-4">
                    <h1 className="text-2xl font-bold text-center text-yellow-500 mb-4">⚡ BEYBLADE X ⚡</h1>
                    
                    <div className="flex justify-around mb-4 bg-slate-800 p-2 rounded-xl">
                        <div className="text-center"><p className="text-xs">WINS</p><p className="text-xl font-bold text-blue-400">{p1.wins}</p></div>
                        <div className="text-center"><p className="text-xs">WINS</p><p className="text-xl font-bold text-red-400">{p2.wins}</p></div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 flex-1">
                        <div className="bg-blue-600 rounded-3xl p-4 flex flex-col items-center">
                            <input value={p1.name} onChange={e => setP1({...p1, name: e.target.value})} className="bg-transparent text-center font-bold w-full mb-2" />
                            <div className="text-7xl font-black my-auto">{p1.score}</div>
                            <div className="grid gap-2 w-full mt-2">
                                <button onClick={() => addScore(1,1)} class="bg-white/20 p-2 rounded-lg text-sm">SPIN(1)</button>
                                <button onClick={() => addScore(1,2)} class="bg-white/20 p-2 rounded-lg text-sm">BURST(2)</button>
                                <button onClick={() => addScore(1,3)} class="bg-red-500 p-2 rounded-lg text-sm font-bold">EXT(3)</button>
                            </div>
                        </div>

                        <div className="bg-red-600 rounded-3xl p-4 flex flex-col items-center">
                            <input value={p2.name} onChange={e => setP2({...p2, name: e.target.value})} className="bg-transparent text-center font-bold w-full mb-2" />
                            <div className="text-7xl font-black my-auto">{p2.score}</div>
                            <div className="grid gap-2 w-full mt-2">
                                <button onClick={() => addScore(2,1)} class="bg-white/20 p-2 rounded-lg text-sm">SPIN(1)</button>
                                <button onClick={() => addScore(2,2)} class="bg-white/20 p-2 rounded-lg text-sm">BURST(2)</button>
                                <button onClick={() => addScore(2,3)} class="bg-red-500 p-2 rounded-lg text-sm font-bold">EXT(3)</button>
                            </div>
                        </div>
                    </div>

                    <button onClick={() => { if(confirm('Reset Match?')) location.reload(); }} className="text-center text-slate-500 text-xs mt-4">Reset All</button>

                    {winner && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50">
                            <div className="bg-yellow-400 text-slate-900 p-8 rounded-3xl text-center celebrate">
                                <h2 className="text-4xl font-black mb-2">WINNER!</h2>
                                <p className="text-2xl font-bold mb-6">{winner}</p>
                                <button onClick={() => { setP1({...p1, score:0}); setP2({...p2, score:0}); setWinner(null); }} className="bg-slate-900 text-white px-8 py-3 rounded-full font-bold">NEXT ROUND</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
