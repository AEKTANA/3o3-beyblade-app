<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beyblade X Scoreboard</title>

  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --primary: #4da3ff;
      --red: #ff4d4d;
      --blue: #4da3ff;
      --text: #ffffff;
      --muted: #9aa0aa;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .top-bar button {
      background: var(--card);
      color: var(--text);
      border: 1px solid #2a2f3a;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .top-bar button:active {
      transform: scale(0.96);
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .player {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player.red { border: 2px solid var(--red); }
    .player.blue { border: 2px solid var(--blue); }

    .player h2 {
      margin: 0;
      text-align: center;
      font-size: 1.2rem;
    }

    .score {
      font-size: 3rem;
      text-align: center;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .buttons button {
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      background: #222633;
      color: var(--text);
    }

    .buttons button:active {
      transform: scale(0.95);
    }

    .finish {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .finish button {
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      background: #2a2f3a;
      color: var(--text);
      border: none;
      cursor: pointer;
    }

    .winner {
      margin-top: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #7CFF7C;
    }

    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .arena {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <h1>⚔️ Beyblade X Match Scoreboard</h1>

  <div class="top-bar">
    <button onclick="resetMatch()">🔄 Reset Match</button>
    <button onclick="toggleSound()">🔊 Sound: <span id="soundStatus">ON</span></button>
  </div>

  <div class="arena">
    <div class="player red">
      <h2>Player RED</h2>
      <div class="score" id="scoreRed">0</div>

      <div class="buttons">
        <button onclick="addScore('red',1)">+1</button>
        <button onclick="addScore('red',2)">+2</button>
        <button onclick="addScore('red',3)">+3</button>
      </div>

      <div class="finish">
        <button onclick="finish('red',3)">Burst</button>
        <button onclick="finish('red',2)">Over</button>
        <button onclick="finish('red',3)">Xtreme</button>
      </div>
    </div>

    <div class="player blue">
      <h2>Player BLUE</h2>
      <div class="score" id="scoreBlue">0</div>

      <div class="buttons">
        <button onclick="addScore('blue',1)">+1</button>
        <button onclick="addScore('blue',2)">+2</button>
        <button onclick="addScore('blue',3)">+3</button>
      </div>

      <div class="finish">
        <button onclick="finish('blue',3)">Burst</button>
        <button onclick="finish('blue',2)">Over</button>
        <button onclick="finish('blue',3)">Xtreme</button>
      </div>
    </div>
  </div>

  <div class="winner" id="winnerText"></div>

  <div class="footer">
    Designed for real Beyblade X competitions
  </div>
</div>

<script>
  let scoreRed = 0;
  let scoreBlue = 0;
  let soundOn = true;
  const WIN_SCORE = 7;

  const clickSound = new Audio();
  clickSound.src =
    "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQgAAAAA";

  function playSound() {
    if (soundOn) {
      clickSound.currentTime = 0;
      clickSound.play();
    }
  }

  function addScore(player, point) {
    if (checkWinner()) return;
    playSound();
    if (player === 'red') {
      scoreRed += point;
      document.getElementById("scoreRed").textContent = scoreRed;
    } else {
      scoreBlue += point;
      document.getElementById("scoreBlue").textContent = scoreBlue;
    }
    checkWinner();
  }

  function finish(player, point) {
    addScore(player, point);
  }

  function checkWinner() {
    if (scoreRed >= WIN_SCORE) {
      document.getElementById("winnerText").textContent = "🏆 Player RED Wins!";
      return true;
    }
    if (scoreBlue >= WIN_SCORE) {
      document.getElementById("winnerText").textContent = "🏆 Player BLUE Wins!";
      return true;
    }
    return false;
  }

  function resetMatch() {
    scoreRed = 0;
    scoreBlue = 0;
    document.getElementById("scoreRed").textContent = 0;
    document.getElementById("scoreBlue").textContent = 0;
    document.getElementById("winnerText").textContent = "";
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("soundStatus").textContent = soundOn ? "ON" : "OFF";
  }
</script>

</body>
</html>
