<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    </script>
    <style>
        /* สไตล์เดิมของคุณอาทั้งหมด */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .title { text-align: center; color: white; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); flex: 1; }
        
        .orientation-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px; padding: 8px 12px; color: white; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 5px;
        }

        .win-counter {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px; display: flex; justify-content: center; align-items: center; gap: 20px; color: white;
        }

        .players-grid { display: grid; gap: 15px; flex: 1; }
        .players-grid.horizontal { grid-template-columns: 1fr 1fr; }
        .players-grid.vertical { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }

        .player-card { border-radius: 24px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; border: 4px solid; }
        .player1 { background: #2563eb; border-color: #60a5fa; }
        .player2 { background: #dc2626; border-color: #f87171; }
        
        /* แก้ไขให้แนวนอนพอดีจอโทรศัพท์ */
        @media (max-height: 500px) {
            .player-score { font-size: 2.2rem !important; }
            .score-btn { padding: 5px !important; }
            .score-btn-icon { font-size: 1.2rem !important; }
            .title { font-size: 1.1rem !important; }
            .score-btn-label { font-size: 0.6rem !important; }
        }

        .player-header { text-align: center; margin-bottom: 5px; }
        .player-name { font-size: 1.2rem; font-weight: bold; color: white; }
        .player-score { font-size: 3.5rem; font-weight: bold; color: white; }
        .player-score-label { font-size: 0.9rem; opacity: 0.8; color: white; }

        .score-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .score-btn {
            padding: 10px 8px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.1s;
        }
        .score-btn:active { transform: scale(0.95); }
        .btn-spin { background: #22c55e; }
        .btn-burst { background: #f97316; }
        .btn-over { background: #a855f7; }
        .btn-extreme { background: #dc2626; }

        .subtract-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
        .subtract-btn { padding: 8px 6px; background: #374151; border: none; border-radius: 8px; color: white; font-weight: bold; }

        .bottom-controls { text-align: center; margin-top: 10px; }
        .button-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .control-btn { padding: 12px 20px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-reset { background: white; color: #1f2937; }
        .btn-reset-all { background: #dc2626; color: white; }
        .btn-rules { background: #fbbf24; color: #1f2937; }
        
        .rules-panel { background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; color: white; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="orientation-btn" onclick="toggleOrientation()">
                <span id="orientationIcon">↕️</span> <span id="orientationText">Vertical</span>
            </button>
            <h1 class="title">⚡ BEYBLADE X ⚡</h1>
            <div style="width: 80px;"></div>
        </div>
        
        <div class="win-counter">
            <div class="win-item">
                <div class="win-count" id="player1Wins">0</div>
                <div class="win-name">Player B</div>
            </div>
            <div style="font-size: 1.5rem;">⚔️</div>
            <div class="win-item">
                <div class="win-count" id="player2Wins">0</div>
                <div class="win-name">Player X</div>
            </div>
        </div>

        <div id="playersGrid" class="players-grid horizontal">
            <div class="player-card player1">
                <div class="player-header">
                    <div class="player-name">Player B</div>
                    <div class="player-score" id="player1Score">0</div>
                    <div class="player-score-label">Points</div>
                </div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="addScore(1, 1)"><span class="score-btn-icon">🌀</span><span class="score-btn-label">Spin Finish</span></button>
                    <button class="score-btn btn-burst" onclick="addScore(1, 2)"><span class="score-btn-icon">💥</span><span class="score-btn-label">Burst Finish</span></button>
                    <button class="score-btn btn-over" onclick="addScore(1, 2)"><span class="score-btn-icon">🕳️</span><span class="score-btn-label">Over Finish</span></button>
                    <button class="score-btn btn-extreme" onclick="addScore(1, 3)"><span class="score-btn-icon">⚡</span><span class="score-btn-label">Extreme Finish</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="subtract-btn" onclick="subtractScore(1, 1)">-1</button>
                    <button class="subtract-btn" onclick="subtractScore(1, 2)">-2</button>
                    <button class="subtract-btn" onclick="subtractScore(1, 3)">-3</button>
                </div>
            </div>

            <div class="player-card player2">
                <div class="player-header">
                    <div class="player-name">Player X</div>
                    <div class="player-score" id="player2Score">0</div>
                    <div class="player-score-label">Points</div>
                </div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="addScore(2, 1)"><span class="score-btn-icon">🌀</span><span class="score-btn-label">Spin Finish</span></button>
                    <button class="score-btn btn-burst" onclick="addScore(2, 2)"><span class="score-btn-icon">💥</span><span class="score-btn-label">Burst Finish</span></button>
                    <button class="score-btn btn-over" onclick="addScore(2, 2)"><span class="score-btn-icon">🕳️</span><span class="score-btn-label">Over Finish</span></button>
                    <button class="score-btn btn-extreme" onclick="addScore(2, 3)"><span class="score-btn-icon">⚡</span><span class="score-btn-label">Extreme Finish</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="subtract-btn" onclick="subtractScore(2, 1)">-1</button>
                    <button class="subtract-btn" onclick="subtractScore(2, 2)">-2</button>
                    <button class="subtract-btn" onclick="subtractScore(2, 3)">-3</button>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="button-row">
                <button class="control-btn btn-reset" onclick="resetRound()">New Round</button>
                <button class="control-btn btn-reset-all" onclick="resetAll()">Reset All</button>
                <button class="control-btn btn-rules" onclick="toggleRules()">Rules</button>
            </div>
            <div id="rulesPanel" class="rules-panel">
                <p>🌀 Spin Finish: 1 PT | 💥 Burst: 2 PT</p>
                <p>🕳️ Over: 2 PT | ⚡ Extreme: 3 PT</p>
                <p style="color:#fbbf24; margin-top:5px;">First to 4 Wins!</p>
            </div>
        </div>
    </div>

    <script>
        // ระบบเสียงและคำนวณคะแนนเดิมของคุณอา
        var state = { player1Score: 0, player2Score: 0, player1Wins: 0, player2Wins: 0, orientation: 'horizontal', audioContext: null };
        function initAudio() { if (!state.audioContext) state.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound() {
            initAudio(); var osc = state.audioContext.createOscillator(); var gain = state.audioContext.createGain();
            osc.connect(gain); gain.connect(state.audioContext.destination);
            osc.frequency.setValueAtTime(800, state.audioContext.currentTime);
            gain.gain.setValueAtTime(0.1, state.audioContext.currentTime);
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.1); osc.stop(state.audioContext.currentTime + 0.1);
        }
        function addScore(p, s) { playSound(); if(p===1) state.player1Score += s; else state.player2Score += s; update(); checkWin(); }
        function subtractScore(p, s) { if(p===1) state.player1Score = Math.max(0, state.player1Score - s); else state.player2Score = Math.max(0, state.player2Score - s); update(); }
        function update() { document.getElementById('player1Score').innerText = state.player1Score; document.getElementById('player2Score').innerText = state.player2Score; }
        function checkWin() {
            if(state.player1Score >= 4) { alert('Player B Wins!'); state.player1Wins++; resetRound(); }
            else if(state.player2Score >= 4) { alert('Player X Wins!'); state.player2Wins++; resetRound(); }
            document.getElementById('player1Wins').innerText = state.player1Wins; document.getElementById('player2Wins').innerText = state.player2Wins;
        }
        function resetRound() { state.player1Score = 0; state.player2Score = 0; update(); }
        function resetAll() { if(confirm('Reset all scores?')) { state.player1Wins = 0; state.player2Wins = 0; resetRound(); document.getElementById('player1Wins').innerText = 0; document.getElementById('player2Wins').innerText = 0; } }
        function toggleRules() { var p = document.getElementById('rulesPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
        function toggleOrientation() {
            var g = document.getElementById('playersGrid'); var t = document.getElementById('orientationText');
            if(state.orientation === 'horizontal') { g.classList.replace('horizontal', 'vertical'); t.innerText = 'Horizontal'; state.orientation = 'vertical'; }
            else { g.classList.replace('vertical', 'horizontal'); t.innerText = 'Vertical'; state.orientation = 'horizontal'; }
        }
    </script>
</body>
</html>
