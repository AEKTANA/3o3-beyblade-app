<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>⚡ BEYBLADE X Scorekeeper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c2d92 50%, #dc2626 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .title { text-align: center; color: white; font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); flex: 1; }
        .orientation-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 8px 12px; color: white; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .win-counter { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px; display: flex; justify-content: center; align-items: center; gap: 20px; color: white; }
        .win-item { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .win-count { font-size: 1.8rem; font-weight: bold; }
        .winner-banner { background: #fbbf24; border: 4px solid #f59e0b; border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 10px; }
        .winner-text { font-size: 1.5rem; font-weight: bold; color: #92400e; }
        .players-grid { display: grid; gap: 15px; flex: 1; }
        .players-grid.horizontal { grid-template-columns: 1fr 1fr; }
        .players-grid.vertical { grid-template-columns: 1fr; }
        .player-card { border-radius: 24px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; border: 4px solid; }
        .player1 { background: #2563eb; border-color: #60a5fa; }
        .player2 { background: #dc2626; border-color: #f87171; }
        .player-score { font-size: 3.5rem; font-weight: bold; color: white; text-align: center; }
        .score-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .score-btn { padding: 12px 8px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .btn-spin { background: #22c55e; } .btn-burst { background: #f97316; } .btn-over { background: #a855f7; } .btn-extreme { background: #dc2626; }
        .subtract-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
        .subtract-btn { padding: 8px 6px; background: #374151; border: none; border-radius: 8px; color: white; cursor: pointer; }
        .bottom-controls { text-align: center; margin-top: 10px; }
        .control-btn { padding: 12px 20px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-reset { background: white; color: #1f2937; }
        .btn-reset-all { background: #dc2626; color: white; }
        .rules-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; color: white; margin-top: 10px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="orientation-btn" onclick="toggleOrientation()">↕️ <span id="orientationText">Vertical</span></button>
            <h1 class="title">⚡ BEYBLADE X ⚡</h1>
            <div style="width: 80px;"></div>
        </div>
        
        <div class="win-counter">
            <div class="win-item"><div>🏆 Wins</div><div class="win-count" id="player1Wins">0</div><div id="displayPlayer1Name">Player B</div></div>
            <div style="font-size: 1.5rem;">⚔️</div>
            <div class="win-item"><div>🏆 Wins</div><div class="win-count" id="player2Wins">0</div><div>Player X</div></div>
        </div>

        <div id="winnerBanner" class="winner-banner" style="display: none;">
            <div class="winner-text" id="winnerText"></div>
        </div>

        <div id="playersGrid" class="players-grid horizontal">
            <div class="player-card player1">
                <div style="text-align: center; color: white; font-weight: bold;" onclick="editPlayer1Name()">
                    <span id="player1NameText">Player B</span>
                    <input type="text" id="player1NameInput" style="display:none; color: black;">
                </div>
                <div class="player-score" id="player1Score">0</div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="addScore(1, 1)">🌀 <span>Spin</span><span>1 PT</span></button>
                    <button class="score-btn btn-burst" onclick="addScore(1, 2)">💥 <span>Burst</span><span>2 PT</span></button>
                    <button class="score-btn btn-over" onclick="addScore(1, 2)">🕳️ <span>Over</span><span>2 PT</span></button>
                    <button class="score-btn btn-extreme" onclick="addScore(1, 3)">⚡ <span>Xtreme</span><span>3 PT</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="subtract-btn" onclick="subtractScore(1, 1)">-1</button>
                    <button class="subtract-btn" onclick="subtractScore(1, 2)">-2</button>
                    <button class="subtract-btn" onclick="subtractScore(1, 3)">-3</button>
                </div>
            </div>

            <div class="player-card player2">
                <div style="text-align: center; color: white; font-weight: bold;">Player X</div>
                <div class="player-score" id="player2Score">0</div>
                <div class="score-buttons">
                    <button class="score-btn btn-spin" onclick="addScore(2, 1)">🌀 <span>Spin</span><span>1 PT</span></button>
                    <button class="score-btn btn-burst" onclick="addScore(2, 2)">💥 <span>Burst</span><span>2 PT</span></button>
                    <button class="score-btn btn-over" onclick="addScore(2, 2)">🕳️ <span>Over</span><span>2 PT</span></button>
                    <button class="score-btn btn-extreme" onclick="addScore(2, 3)">⚡ <span>Xtreme</span><span>3 PT</span></button>
                </div>
                <div class="subtract-buttons">
                    <button class="subtract-btn" onclick="subtractScore(2, 1)">-1</button>
                    <button class="subtract-btn" onclick="subtractScore(2, 2)">-2</button>
                    <button class="subtract-btn" onclick="subtractScore(2, 3)">-3</button>
                </div>
            </div>
        </div>

        <div class="bottom-controls">
            <button class="control-btn btn-reset" onclick="resetRound()">🔄 New Round</button>
            <button class="control-btn btn-reset-all" onclick="resetAll()">🔁 Reset All</button>
            <button class="control-btn" style="background: #fbbf24;" onclick="toggleRules()">📋 Rules</button>
            <div id="rulesPanel" class="rules-panel" style="display: none;">
                <p>🌀 Spin: 1 PT | 💥 Burst: 2 PT</p>
                <p>🕳️ Over: 2 PT | ⚡ Xtreme: 3 PT</p>
                <p style="color: yellow; margin-top: 5px;">🏆 First to 4 points wins!</p>
            </div>
        </div>
    </div>

    <script>
        // ใช้ตัวแปรธรรมดา ไม่ใช้ Object ซ้อน เพื่อป้องกันปัญหาการเข้าถึงข้อมูล
        let p1Score = 0;
        let p2Score = 0;
        let p1Wins = 0;
        let p2Wins = 0;
        let p1Name = "Player B";
        let isGameOver = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function addScore(player, pts) {
            if (isGameOver) return;
            playSound(800, 0.1);
            if (player === 1) {
                p1Score += pts;
                document.getElementById('player1Score').innerText = p1Score;
                if (p1Score >= 4) win(p1Name, 1);
            } else {
                p2Score += pts;
                document.getElementById('player2Score').innerText = p2Score;
                if (p2Score >= 4) win("Player X", 2);
            }
        }

        function subtractScore(player, pts) {
            if (isGameOver) return;
            if (player === 1) {
                p1Score = Math.max(0, p1Score - pts);
                document.getElementById('player1Score').innerText = p1Score;
            } else {
                p2Score = Math.max(0, p2Score - pts);
                document.getElementById('player2Score').innerText = p2Score;
            }
        }

        function win(name, playerNum) {
            isGameOver = true;
            document.getElementById('winnerText').innerText = "🎉 " + name + " WINS! 🎉";
            document.getElementById('winnerBanner').style.display = 'block';
            playSound(500, 0.5);
            if (playerNum === 1) {
                p1Wins++;
                document.getElementById('player1Wins').innerText = p1Wins;
            } else {
                p2Wins++;
                document.getElementById('player2Wins').innerText = p2Wins;
            }
        }

        function resetRound() {
            p1Score = 0; p2Score = 0; isGameOver = false;
            document.getElementById('player1Score').innerText = "0";
            document.getElementById('player2Score').innerText = "0";
            document.getElementById('winnerBanner').style.display = 'none';
        }

        function resetAll() {
            if (!confirm("Reset everything?")) return;
            p1Wins = 0; p2Wins = 0;
            document.getElementById('player1Wins').innerText = "0";
            document.getElementById('player2Wins').innerText = "0";
            resetRound();
        }

        function toggleOrientation() {
            const grid = document.getElementById('playersGrid');
            const btnText = document.getElementById('orientationText');
            if (grid.classList.contains('horizontal')) {
                grid.classList.replace('horizontal', 'vertical');
                btnText.innerText = "Horizontal";
            } else {
                grid.classList.replace('vertical', 'horizontal');
                btnText.innerText = "Vertical";
            }
        }

        function toggleRules() {
            const panel = document.getElementById('rulesPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function editPlayer1Name() {
            const span = document.getElementById('player1NameText');
            const input = document.getElementById('player1NameInput');
            span.style.display = 'none';
            input.style.display = 'inline-block';
            input.value = p1Name;
            input.focus();
            input.onblur = () => {
                p1Name = input.value || "Player B";
                span.innerText = p1Name;
                document.getElementById('displayPlayer1Name').innerText = p1Name;
                span.style.display = 'inline';
                input.style.display = 'none';
            };
        }
    </script>
</body>
</html>
