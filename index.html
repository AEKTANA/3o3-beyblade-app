<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beyblade X Scoreboard</title>

<style>
:root {
  --bg:#0f1115;
  --card:#181b22;
  --red:#ff4d4d;
  --blue:#4da3ff;
  --text:#ffffff;
  --muted:#9aa0aa;
}

* {
  box-sizing:border-box;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app {
  width:100%;
  max-width:900px;
  padding:16px;
}

h1 {
  text-align:center;
  margin-bottom:12px;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:10px;
  flex-wrap:wrap;
}

.top-bar button,
.top-bar input {
  background:var(--card);
  color:var(--text);
  border:1px solid #2a2f3a;
  padding:8px 12px;
  border-radius:10px;
  font-size:0.9rem;
}

.top-bar input {
  width:110px;
  text-align:center;
}

.arena {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.player {
  background:var(--card);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.player.red { border:2px solid var(--red); }
.player.blue { border:2px solid var(--blue); }

.player h2 {
  margin:0;
  text-align:center;
}

.score {
  font-size:3rem;
  text-align:center;
  font-weight:bold;
}

.buttons, .finish {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.buttons button, .finish button {
  padding:14px 0;
  border-radius:12px;
  border:none;
  background:#222633;
  color:var(--text);
  cursor:pointer;
}

.buttons button:active,
.finish button:active {
  transform:scale(0.95);
}

.winner {
  margin-top:12px;
  text-align:center;
  font-size:1.2rem;
  font-weight:bold;
  color:#7CFF7C;
}

.footer {
  margin-top:10px;
  text-align:center;
  font-size:0.8rem;
  color:var(--muted);
}

@media (max-width:700px) {
  .arena { grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="app">
  <h1>⚡ BEYBLADE X ⚡</h1>

  <div class="top-bar">
    <button onclick="resetMatch()">🔄 Reset Match</button>
    <div>
      Win Point:
      <input type="number" id="winInput" min="1" value="7" onchange="updateWinPoint()">
    </div>
    <button onclick="toggleSound()">🔊 <span id="soundText">ON</span></button>
  </div>

  <div class="arena">
    <div class="player red">
      <h2>Player B</h2>
      <div class="score" id="scoreB">0</div>

      <div class="buttons">
        <button onclick="addScore('B',1)">+1</button>
        <button onclick="addScore('B',2)">+2</button>
        <button onclick="addScore('B',3)">+3</button>
      </div>

      <div class="finish">
        <button onclick="addScore('B',3)">Burst</button>
        <button onclick="addScore('B',2)">Over</button>
        <button onclick="addScore('B',3)">Xtreme</button>
      </div>
    </div>

    <div class="player blue">
      <h2>Player X</h2>
      <div class="score" id="scoreX">0</div>

      <div class="buttons">
        <button onclick="addScore('X',1)">+1</button>
        <button onclick="addScore('X',2)">+2</button>
        <button onclick="addScore('X',3)">+3</button>
      </div>

      <div class="finish">
        <button onclick="addScore('X',3)">Burst</button>
        <button onclick="addScore('X',2)">Over</button>
        <button onclick="addScore('X',3)">Xtreme</button>
      </div>
    </div>
  </div>

  <div class="winner" id="winnerText"></div>

  <div class="footer">
    Ready for real competition
  </div>
</div>

<script>
let scoreB = 0;
let scoreX = 0;
let winPoint = 7;
let soundOn = true;

const clickSound = new Audio(
"data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQgAAAAA"
);

function playSound(){
  if(soundOn){
    clickSound.currentTime = 0;
    clickSound.play();
  }
}

function updateWinPoint(){
  const val = parseInt(document.getElementById("winInput").value);
  if(isNaN(val) || val < 1){
    document.getElementById("winInput").value = winPoint;
    return;
  }
  winPoint = val;
  checkWinner();
}

function addScore(player, point){
  if(checkWinner()) return;
  playSound();

  if(player === "B"){
    scoreB += point;
    document.getElementById("scoreB").innerText = scoreB;
  } else {
    scoreX += point;
    document.getElementById("scoreX").innerText = scoreX;
  }
  checkWinner();
}

function checkWinner(){
  if(scoreB >= winPoint){
    document.getElementById("winnerText").innerText = "🏆 Player B Wins!";
    return true;
  }
  if(scoreX >= winPoint){
    document.getElementById("winnerText").innerText = "🏆 Player X Wins!";
    return true;
  }
  return false;
}

function resetMatch(){
  scoreB = 0;
  scoreX = 0;
  document.getElementById("scoreB").innerText = 0;
  document.getElementById("scoreX").innerText = 0;
  document.getElementById("winnerText").innerText = "";
}

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("soundText").innerText = soundOn ? "ON" : "OFF";
}
</script>
</body>
</html>
